server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Docker's internal DNS, so the backend is resolved per request
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri /index.html; # Fallback to index.html for SPA routing
        add_header Cache-Control "no-cache"; # Always check for a new index.html
    }

    # Vite puts a content hash in every file name under /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sitemap is generated by Strapi from the published projects
    location = /sitemap.xml {
        set $backend http://zorzon_backend:1338;
        proxy_pass $backend/api/sitemap.xml;
    }

    error_page 404 /index.html; # Handle 404 errors with SPA fallback

    location /static/ {
        expires 1y;
        access_log off;
    }
}
