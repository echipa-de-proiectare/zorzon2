# Each site gets its own sitemap from Strapi
map $host $sitemap_path {
    default                  /api/sitemap.xml;
    ~^jewellery\.           /api/jewels/sitemap.xml;
}

# Interior design moved from zorzon.com.ro to design.zorzon.com.ro
map $host $is_root_site {
    default        0;
    zorzon.com.ro  1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Docker's internal DNS, so the backend is resolved per request
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri /index.html; # Fallback to index.html for SPA routing
        add_header Cache-Control "no-cache"; # Always check for a new index.html
    }

    # Old interior design addresses on zorzon.com.ro
    location = /design {
        if ($is_root_site) {
            return 301 https://design.zorzon.com.ro/;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(portofoliu|services-and-rates) {
        if ($is_root_site) {
            return 301 https://design.zorzon.com.ro$request_uri;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every file name under /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sitemaps are generated by Strapi from the published projects and jewels
    location = /sitemap.xml {
        set $backend http://zorzon_backend:1338;
        proxy_pass $backend$sitemap_path;
    }

    error_page 404 /index.html; # Handle 404 errors with SPA fallback

    location /static/ {
        expires 1y;
        access_log off;
    }
}
